<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>UbicaTec | Iniciar sesión</title>
  <link rel="stylesheet" href="css/login.css" />
  <link rel="icon" type="image/png" href="/favicon.png" />
</head>
<body>
  <main class="login-contenedor">
    <section class="login-tarjeta">

      <div class="login-marca">
        <div class="login-icono">
          <svg viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="1.8">
            <path d="M20 10c0 6-8 11-8 11S4 16 4 10a8 8 0 1 1 16 0Z"/>
            <circle cx="12" cy="10" r="3"/>
          </svg>
        </div>

        <h1>UbicaTec</h1>
        <p>Instituto Tecnológico de Culiacán</p>
        <span>Tu campus, a un paso de distancia.</span>
      </div>

      <form id="form-login">

        <label for="numero-control">
          Número de control
        </label>

        <input
          id="numero-control"
          name="numero_control"
          type="text"
          inputmode="numeric"
          autocomplete="username"
          placeholder="Ingresa tu número de control"
          maxlength="8"
          pattern="[0-9]{8}"
          required
        />

        <label for="password">
          Contraseña
        </label>

        <input
          id="password"
          name="password"
          type="password"
          autocomplete="current-password"
          placeholder="Ingresa tu contraseña"
          required
        />

        <p id="login-error" role="alert" hidden></p>

        <button id="btn-login" type="submit">
          Iniciar sesión
        </button>

      </form>

      <footer class="login-pie">
        <p>Sistema de orientación académica</p>
        <small>BYG INC. · 2026</small>
      </footer>

    </section>
  </main>

  <script type="module" src="js/login.js"></script>
</body>
</html>
